# Repository label definitions
# Synced by the setup-labels workflow

# Issue type labels
- name: "bug"
  color: "d73a4a"
  description: "Something isn't working"
- name: "enhancement"
  color: "a2eeef"
  description: "New feature or request"
- name: "documentation"
  color: "0075ca"
  description: "Improvements or additions to documentation"

# Priority labels
- name: "priority: critical"
  color: "b60205"
  description: "Must be fixed immediately"
- name: "priority: high"
  color: "d93f0b"
  description: "High priority issue"
- name: "priority: medium"
  color: "fbca04"
  description: "Medium priority issue"
- name: "priority: low"
  color: "0e8a16"
  description: "Low priority issue"

# Status labels
- name: "status: in progress"
  color: "ededed"
  description: "Currently being worked on"
- name: "status: needs review"
  color: "7057ff"
  description: "Waiting for code review"
- name: "status: blocked"
  color: "b60205"
  description: "Blocked by another issue or dependency"

# Component labels
- name: "area: ui"
  color: "c5def5"
  description: "Related to the user interface"
- name: "area: auth"
  color: "bfdadc"
  description: "Related to authentication and login"
- name: "area: firebase"
  color: "ffa500"
  description: "Related to Firebase services"
- name: "area: chat"
  color: "d4c5f9"
  description: "Related to the in-app chat feature"
- name: "area: groups"
  color: "c2e0c6"
  description: "Related to volunteer groups"
- name: "area: notifications"
  color: "e99695"
  description: "Related to push notifications"
- name: "area: maps"
  color: "bfd4f2"
  description: "Related to maps and location features"

# Contribution labels
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"

# Workflow labels
- name: "security"
  color: "ee0701"
  description: "Security-related issue or improvement"
- name: "performance"
  color: "006b75"
  description: "Performance improvement"
- name: "ci/cd"
  color: "5319e7"
  description: "Related to CI/CD pipelines"
- name: "dependencies"
  color: "0366d6"
  description: "Dependency updates"
